name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SoundMark

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "./SoundMark/package-lock.json"

      - name: Install Meteor
        run: curl https://install.meteor.com/ | sh

      - name: Install Dependencies
        run: npm ci

      - name: Install Puppeteer Chromium Dependencies
        run: npx puppeteer browsers install chrome

      - name: Run ESLint
        run: npm run lint

      - name: Run Client & Server Tests
        env:
          TEST_BROWSER_DRIVER: puppeteer
        run: npm run test:ci
