name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SoundMark

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "./SoundMark/package-lock.json"

      - name: Setup Headless Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Meteor
        run: |
          curl https://install.meteor.com/ | sh
          echo "$HOME/.meteor" >> $GITHUB_PATH

      - name: Install Dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: meteor npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Client & Server Tests
        env:
          TEST_BROWSER_DRIVER: puppeteer
          TEST_BROWSER_DRIVER_ARGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run test:ci

  e2e:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./SoundMark

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "./SoundMark/package-lock.json"

      - name: Install Meteor
        run: |
          curl https://install.meteor.com/ | sh
          echo "$HOME/.meteor" >> $GITHUB_PATH

      - name: Install Dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: meteor npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The tests mock R2 in the browser, so placeholder credentials are enough
      # and the server never reaches the real bucket.
      - name: Create Test Settings
        run: |
          mkdir -p private
          cat > private/settings.json <<'EOF'
          {
            "public": {
              "packages": { "accounts": { "clientStorage": "session" } }
            },
            "private": {
              "r2": {
                "accountId": "ci-placeholder",
                "accessKeyId": "ci-placeholder",
                "secretAccessKey": "ci-placeholder",
                "bucketName": "ci-placeholder"
              }
            }
          }
          EOF

      - name: Run Playwright Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: SoundMark/playwright-report/
          retention-days: 14
