name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./SoundMark

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "./SoundMark/package-lock.json"

      - name: Install System Dependencies for Headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libdbus-1-3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2

      - name: Install Meteor
        run: curl https://install.meteor.com/ | sh

      - name: Install Dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Client & Server Tests
        env:
          TEST_BROWSER_DRIVER: puppeteer
          TEST_BROWSER_DRIVER_ARGS: "--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm run test:ci
